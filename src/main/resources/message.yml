    invalid-target: "<red>Enter a player name, UUID, or IP address (CIDR networks are not supported for /alts).</red>"
    heading-account: "<gold>Linked accounts for <target></gold> <gray>(<ips> recorded IPs, page <page>)</gray>"
    heading-ip: "<gold>Accounts seen on <target></gold> <gray>(page <page>)</gray>"
