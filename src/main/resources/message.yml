  uuid: "<gray>UUID: <white><uuid></white></gray>"
  ip: "<gray>IP: <white><ip></white></gray>"
  last-ip: "<gray>Last IP: <white><ip></white></gray>"
  location: "<gray>Location: <white><world> (<x>, <y>, <z>)</white></gray>"
  last-location: "<gray>Last location: <white><world> (<x>, <y>, <z>)</white></gray>"
  banned: "<red>Active ban on record.</red>"
  muted: "<yellow>Active mute on record.</yellow>"
  unknown: "<red>No record found for '<player>'.</red>"

back:
