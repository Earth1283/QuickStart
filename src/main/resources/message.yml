# Customize QuickStart messages with MiniMessage tags, such as <gold> or <bold>.
# Placeholders like <name> and <player> are filled in by QuickStart. Each
# message supports the placeholders shown in its default value.
# You can preview them here: https://webui.advntr.dev/
# For a fixed command, use <click:run_command:'/quickstart:spawn'>Spawn</click>.
# To pass a text placeholder as the argument, use <quickstart:tpaccept:player>Accept</quickstart>.
# Use <hover:show_text:'Tooltip'>Text</hover> to add hover text to either link.
# Omitted entries use the bundled defaults. Run /qs reload to apply edits.

ui:
  control: "<action>"
  action-row: "<actions>"
  destination-row: "<destination>  <delete>"
  delete: "<yellow>[Delete]</yellow>"
  page: "<gray>Page <page> of <pages></gray>  <controls>"
  previous: "<aqua>[Previous]</aqua>"
  next: "<aqua>[Next]</aqua>"
  go-to-page: "Go to page <page>."

common:
  player-only: "<red>This command is only available to players.</red>"
  no-permission: "<red>You do not have permission.</red>"
  invalid-name: "<red>Use 1–<limit> letters, numbers, underscores or hyphens for the name.</red>"
  session-starting: "<yellow>Your QuickStart session is still starting. Try again shortly.</yellow>"
  command-queue-full: "<yellow>QuickStart is still processing your commands. Try again shortly.</yellow>"
  starting: "<yellow>QuickStart is still starting. Try again shortly.</yellow>"
  unavailable: "<red>QuickStart is unavailable. Ask an administrator to run /qs doctor.</red>"
  connection-inactive: "<red>The player connection is no longer active</red>"
  operation-unavailable: "<red><detail></red>"
  storage-failure: "<red><detail></red>"
  operation-failed: "<red>QuickStart could not complete the operation. See the server log.</red>"

usage:
  qs: "<yellow>Usage: /qs [help|modules|doctor|diagnostics startup|reload]</yellow>"
  no-arguments: "<yellow>Usage: /<command></yellow>"
  optional-name: "<yellow>Usage: /<command> [name]</yellow>"
  required-name: '<yellow>Usage: /<command> \<name></yellow>'
  required-player: '<yellow>Usage: /<command> \<player></yellow>'
  optional-page: "<yellow>Usage: /<command> [page]</yellow> <gray>Use a positive page number.</gray>"
  optional-player: "<yellow>Usage: /<command> [player]</yellow>"
  optional-toggle: "<yellow>Usage: /<command> [on|off|default|status]</yellow>"
  seen: '<yellow>Usage: /<command> \<player|uuid></yellow>'

login:
  starting: "<yellow>QuickStart is still starting. Please try again shortly.</yellow>"
  failed: "<red>QuickStart startup failed. Contact a server administrator.</red>"

homes:
  saved: "<green>Home '<name>' saved.</green>"
  updated: "<green>Home '<name>' updated.</green>"
  deleted: "<green>Home '<name>' deleted.</green>"
  teleported: "<green>Teleported to home '<name>'.</green>"
  not-found: "<red>Home '<name>' was not found.</red> <gray>Use /homes to see saved homes.</gray>"
  limit: "<yellow>You have reached your limit of <limit> homes.</yellow> <gray>Use /homes to review your saved homes.</gray>"
  list: "<aqua>Homes: <names></aqua>"
  item: "<hover:show_text:'Teleport to home <name>'><quickstart:home:name><underlined><name></underlined></quickstart></hover>"
  console-item: "<name> (/home <name>)"
  add: "<aqua>[Save a home]</aqua>"
  add-hover: "Fill in the command to save your current location as a home."
  delete-hover: "Fill in the command to delete home <name>."
  empty: "<yellow>You have no saved homes.</yellow>"

warps:
  saved: "<green>Warp '<name>' saved.</green>"
  updated: "<green>Warp '<name>' updated.</green>"
  deleted: "<green>Warp '<name>' deleted.</green>"
  teleported: "<green>Teleported to warp '<name>'.</green>"
  not-found: "<red>Warp '<name>' was not found.</red> <gray>Use /warps to see available warps.</gray>"
  list: "<aqua>Warps: <names></aqua>"
