  console-item: "<name> (/warp <name>)"
  add: "<aqua>[Save a warp]</aqua>"
  add-hover: "Fill in the command to save your current location as a warp."
  delete-hover: "Fill in the command to delete warp <name>."
  empty: "<yellow>No warps are available.</yellow>"

spawn:
