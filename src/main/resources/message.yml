    confirm: "Confirm"
    cancel: "Cancel"
  never: "Never"
  no-reason: "No reason provided."
  banned: "<red><bold>You are banned from this server.</bold></red><newline><reason><newline><gray>Expires <expiration></gray>"
  muted: "<red>You are muted.</red> <reason> <gray>Expires <expiration></gray>"
  kicked: "<red><bold>You were kicked from this server.</bold></red><newline><reason>"
  applied: "<green>/<command> applied to <target>.</green> <gray>Expires <expiration></gray>"
  removed: "<green>/<command> removed the sanction on <target>.</green>"
  no-match: "<yellow>/<command> found no active sanction on <target>.</yellow>"
  kick-confirmed: "<green>Kicked <target>.</green>"
  status:
    bans: "<gold>Active bans for <target></gold>"
    mutes: "<gold>Active mutes for <target></gold>"
    clear: "<gray>No active matching sanctions.</gray>"
    entry: "<yellow><target></yellow> <reason> <gray>Expires <expiration></gray>"
  history:
    heading: "<gold>Moderation history for <target></gold> <gray>(page <page>)</gray>"
    empty: "<gray>No moderation actions on this page.</gray>"
    entry: "<yellow>/<command></yellow> <white><target></white> <gray>by <actor> on <time></gray>"
    details: "  <reason> <gray>Expires <expiration></gray>"
