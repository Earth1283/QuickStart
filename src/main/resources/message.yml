  teleported: "<green>Teleported to spawn.</green>"
  unavailable: "<red>Server spawn is unavailable.</red>"

bedspawn:
  enabled: "<green>Your bed or respawn anchor will be used when you respawn.</green>"
  disabled: "<yellow>You will respawn at server spawn instead of your bed or respawn anchor.</yellow>"
  default-on: "<green>Following the server default: your bed or respawn anchor will be used when you respawn.</green>"
  default-off: "<yellow>Following the server default: you will respawn at server spawn instead of your bed or respawn anchor.</yellow>"
  respawn-inactive: "<gray>Note: spawn-on-respawn is currently disabled in server settings, so vanilla respawn applies.</gray>"
