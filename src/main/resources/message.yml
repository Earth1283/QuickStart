    empty: "<gray>No linked accounts found for <target>.</gray>"
    entry: "<white><player></white> <status> <gray>• <seen> • IP: <ips></gray>"
    badge-online: "<green>[Online]</green>"
    badge-offline: "<gray>[Offline]</gray>"
    badge-banned: "<red>[Banned]</red>"
    badge-muted: "<yellow>[Muted]</yellow>"
    badge-online-muted: "<green>[Online]</green> <yellow>[Muted]</yellow>"
    active-now: "online now"
    last-seen: "last seen <duration> ago"
  buttons:
    status: "<aqua>[Status]</aqua>"
    history: "<aqua>[History]</aqua>"
    alts: "<aqua>[Alts]</aqua>"
    seen: "<aqua>[Seen]</aqua>"
    unban: "<yellow>[Unban]</yellow>"
    unmute: "<yellow>[Unmute]</yellow>"
    previous: "<aqua>[Previous]</aqua>"
    next: "<aqua>[Next]</aqua>"
