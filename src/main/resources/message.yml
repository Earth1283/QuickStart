  cooldown: "<yellow>Please wait before sending another teleport request.</yellow>"
  player-unavailable: "<red>That player is unavailable.</red>"
  self: "<red>You cannot request a teleport with yourself.</red>"
  no-match: "<yellow>You have no matching teleport request.</yellow> <inbox>"
  denied: "<yellow>Teleport request from <player> denied.</yellow>"
  denied-notice: "<yellow><player> denied your teleport request.</yellow>"
  completed: "<green>Teleport request from <player> completed.</green>"
  accepted-notice: "<green><player> accepted your teleport request.</green>"

teleport:
  warmup: "<yellow>Teleporting in <seconds>s. Stay still!</yellow>"
  cancelled: "<red>The teleport was cancelled.</red>"
  cancelled-movement: "<red>Teleport cancelled because the player moved.</red>"
  cancelled-damage: "<red>Teleport cancelled because the player took damage.</red>"
  cooldown: "<yellow>Teleport is on cooldown. Try again shortly.</yellow>"
  in-progress: "<yellow>A teleport is already in progress. Wait for it to finish.</yellow>"
  world-unavailable: "<red>The destination world is unavailable.</red>"
  disconnected: "<red>A player involved in the teleport disconnected.</red>"
  unsafe-bounds: "<red>Teleport cancelled: the destination is outside the world bounds or border.</red> <gray>Use /safeteleport off to bypass.</gray>"
  unsafe-hazard: "<red>Teleport cancelled: the destination is hazardous (lava, fire, or damaging block).</red> <gray>Use /safeteleport off to bypass.</gray>"
  unsafe-obstructed: "<red>Teleport cancelled: the destination is obstructed.</red> <gray>Use /safeteleport off to bypass.</gray>"
  unsafe-drop: "<red>Teleport cancelled: the destination has no safe ground underneath.</red> <gray>Use /safeteleport off to bypass.</gray>"

moderation:
