# Startup modes: LAZY | ADHD | ALL_AT_ONCE
# LAZY - Starts up the core of the plugin, and then loads features as players use them
# ADHD (Default) - This loads only the core of the plugin when the server starts, but we use the
#                  gap between the server finishing its initialization phase and the first player
#                  joins to initialize modules.
# ALL_AT_ONCE - Load all enabled modules on startup.

# How do I choose? For most servers, ADHD is enough. If your server is behind a proxy, such as
# Velocity or Bungeecord, enable ALL_AT_ONCE, as proxies tend to release a large batch of players
# the moment Paper declares itself fully initialized, leading to higher CPU usage at the worst time.
# However, if your server is running on a free tier server host or limited RAM, use LAZY.
startup: ADHD

modules:
  homes: true
  warps: true
  spawn: true
  teleportation: true

homes:
  limit: 5

warps:
  # Require quickstart.warp.<name> to use or list each warp.
  per-warp-permissions: false

spawn:
  # Send new players to the configured spawn once they join.
  first-join: false

teleportation:
  cooldown-seconds: 5
  request-expiration-seconds: 60

# Advanced settings. Startup, modules, performance and storage require a restart.
performance:
  warmup:
    enabled: true
    empty-server-workers: 2
    active-server-workers: 1 # Keep this less than the value you put for empty server workers.
    pause-optional-on-join: true

storage:
  backend: sqlite

telemetry:
  enabled: false

scope-creep:
  scripting:
    enabled: false
