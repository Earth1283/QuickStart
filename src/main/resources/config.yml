# QuickStart configuration
# Settings under startup, modules, performance, and storage require a server restart.
# Other settings can be reloaded with /qs reload.

# Startup initialization strategy:
#   ADHD (default) - Pre-warms modules in the background before the first player joins.
#   LAZY           - Loads modules on-demand when first used.
#   ALL_AT_ONCE    - Loads all modules during startup before accepting logins (recommended for proxies).
startup: ADHD

# Enable or disable individual feature modules.
modules:
  homes: true
  warps: true
  spawn: true
  teleportation: true # tpa requests
  moderation: true
  seen: true

# Personal player homes (/home, /sethome, /delhome, /homes).
homes:
  # Maximum number of homes a player can set.
  limit: 5
  # Cooldown in seconds between home teleports (0 to disable).
  cooldown-seconds: 0
  # Maximum length for home names (1-32 characters).
  name-max-length: 32

# Server-wide warps (/warp, /setwarp, /delwarp, /warps).
warps:
  # Require quickstart.warp.<name> to use or list each warp.
  per-warp-permissions: false
  # Cooldown in seconds between warp teleports (0 to disable).
  cooldown-seconds: 0
  # Maximum length for warp names (1-32 characters).
  name-max-length: 32

# Server spawn point (/spawn, /setspawn).
spawn:
  # Teleport players to spawn on their first join.
  first-join: false
  # Teleport players to spawn after dying.
  on-respawn: false
  # Keep a player's bed or respawn anchor when spawn.on-respawn is enabled.
  # Players with quickstart.spawn.bedoverride can override this for themselves.
  respect-bed-spawn: true
  # Teleport players to spawn on every join.
  on-join: false
  # Cooldown in seconds between /spawn uses (0 to disable).
  cooldown-seconds: 0

# Teleport settings for QuickStart commands.
teleportation:
  # Action bar countdown before teleporting (0 for immediate teleports).
  warmup-seconds: 3
  # Default cooldown in seconds for each request and /back action (0 to disable).
  cooldown-seconds: 5
  # Optional overrides. Each action has its own timer.
  # request-send-cooldown-seconds: 5
  # request-teleport-cooldown-seconds: 5
  # back-cooldown-seconds: 5
  # Time in seconds before a pending teleport request expires.
  request-expiration-seconds: 60
  # Send /tpahere recipients to the sender's location when the request was made.
  strict-tpahere: false
  # Record player's death location for /back.
  back-on-death: true
  # Record location before QuickStart and other teleports for /back.
  back-on-teleport: true
  # Verify destinations are safe before teleporting (avoids hazards, suffocation, and unsafe drops).
  # Players with quickstart.teleport.safetoggle can override this for themselves.
  safe-teleport: true

# Background warmup settings for ADHD startup mode.
performance:
  warmup:
    enabled: true
    # Worker threads when no players are online (0-16).
    empty-server-workers: 2
    # Worker threads when players are online (must be <= empty-server-workers).
    active-server-workers: 1
    # Pause warmup while players are online.
    pause-optional-on-join: true

# Storage backend settings.
storage:
  backend: sqlite
  # Maximum number of queued database operations before rejecting new requests.
  max-pending-operations: 128

# bStats telemetry metrics
telemetry:
  enabled: false

# Experimental features
scope-creep:
  scripting:
    enabled: false
