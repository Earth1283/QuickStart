name: QuickStart
description: A lightweight, modular, Folia-first essentials suite.
version: '${version}'
main: io.github.Earth1283.quickStart.QuickStart
folia-supported: true
api-version: '26.1.2'
load: STARTUP
authors: [Earth1283]
commands:
  qs:
    description: Show QuickStart help and diagnostics.
    usage: /<command> [help|modules|doctor|diagnostics startup|reload|mod <target>]
  tpa:
    description: Ask to teleport to another player.
    usage: /<command> <player>
    permission: quickstart.tpa
  tpahere:
    description: Ask another player to teleport to you.
    usage: /<command> <player>
    permission: quickstart.tpa
  tpaccept:
    description: Accept a teleport request.
    usage: /<command> [player]
    permission: quickstart.tpa
  tpdeny:
    description: Decline a teleport request.
    usage: /<command> [player]
    permission: quickstart.tpa
  tprequests:
    description: Browse your incoming teleport requests.
    usage: /<command> [page]
    permission: quickstart.tpa
  back:
    description: Return to your previous location.
    usage: /<command>
    permission: quickstart.back
  safeteleport:
    description: Toggle safe destination checks for your teleports.
    aliases: [safetp]
    usage: /<command> [on|off|default|status]
    permission: quickstart.teleport.safetoggle
  sethome:
    description: Save a home at your current location.
    usage: /<command> [name]
    permission: quickstart.homes
  home:
    description: Teleport to a saved home.
    usage: /<command> [name]
    permission: quickstart.homes
  delhome:
    description: Delete a saved home.
    usage: /<command> [name]
    permission: quickstart.homes
  homes:
    description: List your saved homes.
    usage: /<command> [page]
    permission: quickstart.homes
  setwarp:
    description: Save a server warp at your current location.
    usage: /<command> <name>
    permission: quickstart.warps.manage
  warp:
    description: Teleport to a server warp.
    usage: /<command> <name>
    permission: quickstart.warps
  delwarp:
    description: Delete a server warp.
    usage: /<command> <name>
    permission: quickstart.warps.manage
  warps:
    description: List the server warps you can use.
    usage: /<command> [page]
    permission: quickstart.warps
  setspawn:
    description: Save the server spawn at your current location.
    usage: /<command>
    permission: quickstart.spawn.manage
  spawn:
    description: Teleport to the server spawn.
    usage: /<command>
    permission: quickstart.spawn
  bedspawn:
    description: Choose whether your bed or respawn anchor overrides server spawn on respawn.
    usage: /<command> [on|off|default|status]
    permission: quickstart.spawn.bedoverride
  seen:
    description: Check when a player was last online.
    usage: /<command> <player|uuid>
    permission: quickstart.seen
  ban:
    description: Permanently ban a player account.
    usage: /<command> <player|uuid> [reason]
    permission: quickstart.moderation.ban
  tempban:
    description: Temporarily ban a player account.
    usage: /<command> <player> <duration> <reason>
    permission: quickstart.moderation.tempban
  unban:
    description: Lift a QuickStart account ban.
    usage: /<command> <player|uuid>
    permission: quickstart.moderation.unban
  ipban:
    description: Permanently ban an IP address.
    aliases: [banip]
    usage: /<command> <ip|online player> [reason]
    permission: quickstart.moderation.ipban
  tempipban:
    description: Temporarily ban an IP address.
    usage: /<command> <ip|online player> <duration|date time> [reason]
    permission: quickstart.moderation.tempipban
  unbanip:
    description: Lift a QuickStart IP ban.
    usage: /<command> <ip|online player>
    permission: quickstart.moderation.unbanip
  iprangeban:
    description: Permanently ban an IP network using CIDR notation.
    usage: /<command> <cidr> [reason]
    permission: quickstart.moderation.iprangeban
  tempiprangeban:
    description: Temporarily ban an IP network using CIDR notation.
    usage: /<command> <cidr> <duration|date time> [reason]
    permission: quickstart.moderation.tempiprangeban
  unbaniprange:
    description: Lift a QuickStart IP network ban.
    usage: /<command> <cidr>
    permission: quickstart.moderation.unbaniprange
  mute:
    description: Permanently mute a player account.
    usage: /<command> <player|uuid> [reason]
    permission: quickstart.moderation.mute
  tempmute:
    description: Temporarily mute a player account.
    usage: /<command> <player|uuid> <duration|date time> [reason]
    permission: quickstart.moderation.tempmute
  unmute:
    description: Lift a QuickStart account mute.
    usage: /<command> <player|uuid>
    permission: quickstart.moderation.unmute
  ipmute:
    description: Permanently mute an IP address.
    usage: /<command> <ip|online player> [reason]
    permission: quickstart.moderation.ipmute
  tempipmute:
    description: Temporarily mute an IP address.
    usage: /<command> <ip|online player> <duration|date time> [reason]
    permission: quickstart.moderation.tempipmute
  unmuteip:
    description: Lift a QuickStart IP mute.
    usage: /<command> <ip|online player>
    permission: quickstart.moderation.unmuteip
  kick:
    description: Disconnect an online player with a message.
    usage: /<command> <player> [reason]
    permission: quickstart.moderation.kick
  banstatus:
    description: Check active QuickStart bans for an account, address, or network.
    usage: /<command> <player|uuid|ip|cidr>
    permission: quickstart.moderation.banstatus
  mutestatus:
    description: Check active QuickStart mutes for an account or address.
    usage: /<command> <player|uuid|ip>
    permission: quickstart.moderation.mutestatus
  modhistory:
    description: Browse QuickStart moderation history for an account, address, or network.
    usage: /<command> <player|uuid|ip|cidr> [page]
    permission: quickstart.moderation.modhistory
  alts:
    description: List accounts that share recorded IP addresses with a player or IP.
    usage: /<command> <player|uuid|ip> [page]
    permission: quickstart.moderation.alts
permissions:
  quickstart.moderation:
    description: Use all QuickStart moderation commands.
    default: op
    children:
      quickstart.moderation.ban: true
      quickstart.moderation.tempban: true
      quickstart.moderation.unban: true
      quickstart.moderation.ipban: true
      quickstart.moderation.tempipban: true
      quickstart.moderation.unbanip: true
      quickstart.moderation.iprangeban: true
      quickstart.moderation.tempiprangeban: true
      quickstart.moderation.unbaniprange: true
      quickstart.moderation.mute: true
      quickstart.moderation.tempmute: true
      quickstart.moderation.unmute: true
      quickstart.moderation.ipmute: true
      quickstart.moderation.tempipmute: true
      quickstart.moderation.unmuteip: true
      quickstart.moderation.kick: true
      quickstart.moderation.inspect: true
  quickstart.moderation.inspect:
    description: Inspect moderation status, history, and linked accounts.
    default: false
    children:
      quickstart.moderation.banstatus: true
      quickstart.moderation.mutestatus: true
      quickstart.moderation.modhistory: true
      quickstart.moderation.alts: true
  quickstart.moderation.ban:
    default: false
  quickstart.moderation.tempban:
    default: false
  quickstart.moderation.unban:
    default: false
  quickstart.moderation.ipban:
    default: false
  quickstart.moderation.tempipban:
    default: false
  quickstart.moderation.unbanip:
    default: false
  quickstart.moderation.iprangeban:
    default: false
  quickstart.moderation.tempiprangeban:
    default: false
  quickstart.moderation.unbaniprange:
    default: false
  quickstart.moderation.mute:
    default: false
  quickstart.moderation.tempmute:
    default: false
  quickstart.moderation.unmute:
    default: false
  quickstart.moderation.ipmute:
    default: false
  quickstart.moderation.tempipmute:
    default: false
  quickstart.moderation.unmuteip:
    default: false
  quickstart.moderation.kick:
    default: false
  quickstart.moderation.banstatus:
    default: false
  quickstart.moderation.mutestatus:
    default: false
  quickstart.moderation.modhistory:
    default: false
  quickstart.moderation.alts:
    default: false
  quickstart.admin:
    description: Inspect and reload QuickStart settings.
    default: op
  quickstart.tpa:
    default: true
  quickstart.back:
    default: true
  quickstart.teleport.safetoggle:
    description: Override safe-teleport validation for your own teleports.
    default: true
  quickstart.homes:
    default: true
  quickstart.warps:
    default: true
  quickstart.warps.manage:
    default: op
  quickstart.warps.bypass:
    description: Access all warps when individual permissions are enabled.
    default: op
  quickstart.spawn:
    default: true
  quickstart.spawn.bedoverride:
    description: Override whether your bed or respawn anchor takes precedence over server spawn.
    default: true
  quickstart.spawn.manage:
    default: op
  quickstart.seen:
    description: Check when a player was last seen online.
    default: true
  quickstart.seen.details:
    description: View IP address, UUID, location, and moderation details in /seen.
    default: op
